<svg xmlns="http://www.w3.org/2000/svg" width="860" height="180" viewBox="0 0 860 180"><style>
 .bg{fill:#0d1117;stroke:#30363d} .tile{fill:#161b22;stroke:#30363d} .chip{fill:#161b22;stroke:#30363d}
 .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3} .m{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#8b949e} .acc{fill:#7aa2f7} .accs{stroke:#7aa2f7}
 .ic{fill:#8b949e} .ic *{fill:#8b949e !important;stroke:none !important} .ln{stroke:#30363d}
 @media (prefers-color-scheme: light){
  .bg{fill:#ffffff;stroke:#d0d7de} .tile,.chip{fill:#f6f8fa;stroke:#d0d7de} .t{fill:#1f2328} .m{fill:#59636e}
  .acc{fill:#2f6feb} .accs{stroke:#2f6feb} .ic{fill:#59636e} .ic *{fill:#59636e !important} .ln{stroke:#d0d7de} }
 .f{animation:fade .6s ease backwards}
 @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
 .pulse{animation:pulse 1.8s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
 @keyframes pulse{0%,100%{opacity:.9;transform:scale(1)}50%{opacity:.25;transform:scale(1.5)}}
 @media (prefers-reduced-motion: reduce){.f,.pulse{animation:none}}
