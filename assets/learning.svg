8.0" y="86" font-size="11.5" font-weight="600" text-anchor="middle">Context + memory</text></g><g class="f" style="animation-delay:0.40s"><circle class="tile" cx="652.0" cy="104" r="5" stroke-width="1.5"/><text class="m" x="652.0" y="132" font-size="11.5" font-weight="400" text-anchor="middle">Evals + observability</text></g><g class="f" style="animation-delay:0.45s"><circle class="tile" cx="726.0" cy="104" r="5" stroke-width="1.5"/><text class="m" x="726.0" y="86" font-size="11.5" font-weight="400" text-anchor="middle">Red-teaming</text></g><g class="f" style="animation-delay:0.50s"><circle class="tile" cx="800.0" cy="104" r="5" stroke-width="1.5"/><text class="m" x="800.0" y="132" font-size="11.5" font-weight="400" text-anchor="middle">Data agents</text></g><g class="f" style="animation-delay:.6s"><circle class="acc" cx="32" cy="158" r="4"/><text class="m" x="42" y="162" font-size="11">done</text><circle class="acc" cx="86" cy="158" r="4"/><circle class="acc" cx="86" cy="158" r="7" opacity=".35"/><text class="m" x="98" y="162" font-size="11">now</text><circle class="tile" cx="140" cy="158" r="4"/><text class="m" x="150" y="162" font-size="11">next</text></g></svg>