name: Generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#7aa2f7&color_dots=#161b22,#1f2a44,#2c3e6b,#4a64a8,#7aa2f7
            dist/snake-light.svg?palette=github-light&color_snake=#2f6feb&color_dots=#ebedf0,#c6d4f5,#93b0ee,#5a86e6,#2f6feb
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
