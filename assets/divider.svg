<svg xmlns="http://www.w3.org/2000/svg" width="860" height="24" viewBox="0 0 860 24">
<defs>
 <linearGradient id="l" x1="0" x2="1"><stop offset="0" class="a0"/><stop offset="1" class="a1"/></linearGradient>
 <linearGradient id="r" x1="0" x2="1"><stop offset="0" class="a1"/><stop offset="1" class="a0"/></linearGradient>
</defs>
<style>.a0{stop-color:#30363d;stop-opacity:0} .a1{stop-color:#3d444d;stop-opacity:1} .acc{fill:#7aa2f7}
@media (prefers-color-scheme: light){.a0{stop-color:#d0d7de;stop-opacity:0} .a1{stop-color:#d0d7de;stop-opacity:1} .acc{fill:#2f6feb}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.05;transform:scale(2.4)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}</style>
<rect x="40" y="11.5" width="374.0" height="1" fill="url(#l)"/>
<rect x="446.0" y="11.5" width="374.0" height="1" fill="url(#r)"/>
<circle class="acc pulse" cx="430.0" cy="12.0" r="3.5"/><circle class="acc" cx="430.0" cy="12.0" r="3"/>
</svg>