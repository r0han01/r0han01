<svg xmlns="http://www.w3.org/2000/svg" width="420" height="146" viewBox="0 0 420 146"><style>
 .bg{fill:#0d1117;stroke:#30363d} .tile{fill:#161b22;stroke:#30363d} .chip{fill:#161b22;stroke:#30363d}
